# ============================================================================
# Stage 1: C3 confidence probe training config
# ============================================================================
#
# Single-GPU usage:
#   python trainer/train_c3_probe.py \
#       --evac_ckpt  /share/project/robocoin/hywu/lx/EVAC-C3/checkpoints/EVAC/EnerV_AC_deepspeed_v0.1.pt \
#       --evac_cfg   configs/agibotworld/train_c3_probe.yaml \
#       --index      data_index.json \
#       --output_dir logs/c3_probe_v1
#
# 4-GPU DDP usage:
#   torchrun --nproc_per_node=4 trainer/train_c3_probe.py \
#       --evac_ckpt  /share/project/robocoin/hywu/lx/EVAC-C3/checkpoints/EVAC/EnerV_AC_deepspeed_v0.1.pt \
#       --evac_cfg   configs/agibotworld/train_c3_probe.yaml \
#       --index      data_index.json \
#       --output_dir logs/c3_probe_v1
#
# Key differences from train_config.yaml:
#   1. enable_c3_probe: true  -> instantiates C3ConfidenceProbe
#   2. image_proj_model_trainable / traj_prompt_proj_model_trainable: false
#      -> saves VRAM (probe training needs no gradients for these two projectors)
#   3. base_learning_rate raised to 3e-4 (only the probe is trained, so a larger LR works)
#   4. batch_size lowered to 2 (the full UNet forward still takes a lot of VRAM)
#   5. max_steps lowered to 30000 (the probe converges much faster than full-model training)
#   6. dataset switched to the Challenge flat format (AgiBotWorldICRA26Challenge)
#   7. batch_logger removed (no DDIM sampling visualization during probe training)
# ============================================================================

chunk: 16
n_previous: 4
n_view: 1

# ---------------------------------------------------------------------------
# Data index (generated by prepare_data.py)
# Read by train_c3_probe.py --index parameter; recorded here for reference
# ---------------------------------------------------------------------------
data_index: data_index.json

model:

  pretrained_checkpoint: /share/project/robocoin/hywu/lx/EVAC-C3/checkpoints/EVAC/EnerV_AC_deepspeed_v0.1.pt

  auto_padzero_input_block: False
  auto_padrand_input_block: False

  # probe training only updates C3ConfidenceProbe params, so a larger LR works
  base_learning_rate: 3e-4
  scale_lr: False
  target: evac.lvdm.models.ddpm3d.ACWMLatentDiffusion
  params:
    rescale_betas_zero_snr: True
    parameterization: "v"
    linear_start: 0.00085
    linear_end: 0.012
    num_timesteps_cond: 1
    log_every_t: 20
    timesteps: 1000
    first_stage_key: ["video", "traj"]
    cond_stage_key: delta_action
    cond_stage_trainable: False

    # -- freeze all non-probe components ------------------------------------
    freeze_embedder: True          # CLIP image embedder stays frozen
    image_proj_model_trainable: False     # do not train image proj (saves VRAM)
    traj_prompt_proj_model_trainable: False  # do not train traj proj

    conditioning_key: hybrid
    image_size: [40, 64]
    channels: 4
    scale_by_std: False
    scale_factor: 0.18215
    use_ema: False
    uncond_prob: 0.1
    uncond_type: 'zero_embed'
    rand_cond_frame: true
    use_dynamic_rescale: true
    base_scale: 0.7
    fps_condition_type: 'fps'
    perframe_ae: True
    ae_batch_size: 2
    chunk: ${chunk}
    n_view: ${n_view}

    use_raymap_dir: True
    use_raymap_origin: True
    use_cat_mask: True

    sparse_memory: True
    ddim_num_chunk: 1
    views_name_wo_imgcat: ["left_hand", "right_hand"]

    # ── C3 Confidence Probe ───────────────────────────────────────────────
    enable_c3_probe: true
    c3_probe_config:
      mid_channels: 1280       # UNet middle_block output channels (fixed)
      dec_channels: 1280       # first decoder upsample output channels of the UNet (fixed)
      emb_dim: 1280            # UNet time+fps+domain embedding dim (fixed)
      probe_dim: 256           # probe internal feature dim
      n_heads: 4               # Transformer attention heads
      n_spatial_layers: 3      # spatial Transformer layers
      n_temporal_layers: 3     # temporal Transformer layers
      max_h: 20                # max spatial-PE height (EVAC outputs 10; keep headroom)
      max_w: 32                # max spatial-PE width (EVAC outputs 16; keep headroom)
      max_T: 32                # max temporal-PE frames
      # NOTE: these two values are absolute MAE thresholds and must be aligned manually with the actual error distribution
      # Procedure: start training with arbitrary initial values, observe mae_p10 / mae_p90 in first 100 steps of logs
      # then set threshold_low near mae_p10 and threshold_high near mae_p90
      # and retrain. Target: stabilize label_mean between 0.3~0.7
      threshold_low: 0.35      # initial placeholder; replace using the logged mae_p10
      threshold_high: 0.85     # initial placeholder; replace using the logged mae_p90
      dropout: 0.1             # Transformer dropout, prevents probe overfitting

    unet_config:
      target: evac.lvdm.modules.networks.openaimodel3dcausal.UNetModel
      params:
        in_channels: 19
        out_channels: 4
        model_channels: 320
        attention_resolutions:
        - 4
        - 2
        - 1
        num_res_blocks: 2
        channel_mult:
        - 1
        - 2
        - 4
        - 4
        dropout: 0.1
        num_head_channels: 64
        transformer_depth: 1
        context_dim: 1024
        use_linear: true
        use_checkpoint: True       # gradient checkpointing saves VRAM
        temporal_conv: True
        temporal_attention: True
        temporal_selfatt_only: true
        temporal_batch_size: -1
        use_causal_attention: false
        temporal_length: 20
        addition_attention: true
        image_cross_attention: true
        traj_cross_attention: true
        default_fs: 30
        fs_condition: true
        resblock_updown: false
        chunk: ${chunk}
        n_view: ${n_view}
        causal_temp_conv: true
        use_block_idx: true
        use_domain_embedding: true
        adapt_to_mvt: True

    first_stage_config:
      target: evac.lvdm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: True
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config:
      target: evac.lvdm.modules.encoders.resampler.Resampler
      params:
        dim: 1024
        depth: 4
        dim_head: 64
        heads: 12
        num_queries: 16
        embedding_dim: 14
        output_dim: 1024
        ff_mult: 4

    img_cond_stage_config:
      target: evac.lvdm.modules.encoders.condition.FrozenOpenCLIPImageEmbedderV2
      params:
        abspath: /share/project/robocoin/hywu/lx/EVAC-C3/checkpoints/CLIP/open_clip_pytorch_model.bin
        freeze: true

    image_proj_stage_config:
      target: evac.lvdm.modules.encoders.resampler.Resampler
      params:
        dim: 1024
        depth: 4
        dim_head: 64
        heads: 12
        num_queries: 16
        embedding_dim: 1280
        output_dim: 1024
        ff_mult: 4
        video_length: 16

# ---------------------------------------------------------------------------
# Dataset path (change before training)
#
# train_c3_probe.py reads training data via --index and validation data via --val_root.
# This data section only supplies hyperparams like sample_size / chunk / n_previous.
#
# Path description:
#   train_root  <- parent dir of {task_id}-{episode_id}-{segment_id}/ (i.e. train/ itself)
#                 Example: /data/agibotworld/train
#   val_root    <- dir containing gt_dataset/ and info_dataset/
#                 e.g. /data/agibotworld/validation
#                 ProbeValDataset uses gt_dataset/video/frame_*.png as ground-truth frames
# ---------------------------------------------------------------------------

# NOTE: val_root path (can be overridden by the --val_root CLI arg)
data:
  val_root: "/share/project/robocoin/hywu/kyy/datasets/AgiBotWorldChallenge-2026/WorldModel/validation"
  target: dataset.utils_data.DataModuleFromConfig
  params:
    # the full UNet forward still takes VRAM during probe training, so batch_size is smaller than full training
    batch_size: 2
    num_workers: 4
    train:
      target: dataset.agibotworld_challenge_dataset.AgiBotWorldICRA26Challenge
      params:
        # NOTE: set to the parent directory of TRAIN_ROOT (without /train)
        data_roots: ["/share/project/robocoin/hywu/kyy/datasets/AgiBotWorldChallenge-2026/WorldModel"]
        domains: ["agibotworld"]
        split: "train"
        sample_size: [320, 512]
        # n_previous(4) + chunk(16) = 20 frames
        sample_n_frames: 20
        preprocess: 'resize'
        valid_cam: 'head'
        chunk: ${chunk}
        n_previous: ${n_previous}
        previous_pick_mode: 'uniform'
        random_crop: True
        min_sep: 1
        max_sep: 3
    # validation uses ProbeValDataset (info_dataset + gt_dataset/video/frame_*.png)
    # built directly by train_c3_probe.py build_val_dataloader(), not via DataModuleFromConfig

# ---------------------------------------------------------------------------
# Lightning section (reference only; train_c3_probe.py is a standalone script and does not read this)
# ---------------------------------------------------------------------------
lightning:
  precision: 16
  trainer:
    benchmark: True
    accumulate_grad_batches: 1
    max_steps: 30000          # the probe converges fast; 30k steps is usually enough
    log_every_n_steps: 50
    val_check_interval: 1000
    gradient_clip_algorithm: 'norm'
    gradient_clip_val: 1.0    # the probe has few params and stable gradients; relax clipping
  callbacks:
    model_checkpoint:
      target: pytorch_lightning.callbacks.ModelCheckpoint
      params:
        every_n_train_steps: 2000
        filename: "c3probe-{step}"
        save_weights_only: True
    metrics_over_trainsteps_checkpoint:
      target: pytorch_lightning.callbacks.ModelCheckpoint
      params:
        filename: 'c3probe-{step}'
        save_weights_only: True
        every_n_train_steps: 5000
    # batch_logger removed: no DDIM sampling visualization during probe training
